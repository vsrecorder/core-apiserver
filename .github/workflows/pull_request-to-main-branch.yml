name: For pull request to main branch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "master"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go 1.27.4
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      # gofmt で整形されていないファイルがあれば落とす(make lint-fmt と同じ検査)。
      # テストより先に置き、整形漏れだけのときに長いテストを待たずに気付けるようにする。
      - name: Check gofmt
        run: make lint-fmt
      # infrastructure の書き込みが dbFromContext を経由しているかを検査する(make lint-tx)。
      # i.db を直接使うと、usecase 側のトランザクションに参加せず片方だけコミットされる。
      - name: Check transaction usage
        run: make lint-tx
      # CIのrunnerはUTC、開発機と本番はJSTのため両方で回す。片方だけだと、
      # time.Local に依存したテストが一方の環境でだけ通ってすり抜ける。
      # -count=1 はキャッシュ無効化。TZ はテストキャッシュのキーに入らないため、
      # 付けないと2回目が素通りして片方のタイムゾーンしか検証されない。
      - name: Run Test (UTC)
        run: TZ=UTC go test -count=1 -v -cover -race ./...
      - name: Run Test (Asia/Tokyo)
        run: TZ=Asia/Tokyo go test -count=1 -v -cover -race ./...

  build-and-push-container-image:
    needs:
      - test
    runs-on: ubuntu-latest
    env:
      # Dependabot が起動した実行と fork からの PR には Actions のシークレットが渡されない
      # (Dependabot の実行に見えるのは Dependabot 用のシークレットだけ)ため、ログインできずに
      # 落ちる。これらはビルドだけ行い、ログインと push はしない。ビルドは残すので、
      # ベースイメージの更新で Dockerfile が壊れていないかは確かめられる。
      #
      # Dependabot 用に Docker の認証情報を登録する手もあるが、取り込むか決める前の依存更新を
      # 含むイメージで develop タグを自動で上書きすることになるので採らない。なお人が
      # Dependabot のブランチを更新(Update branch や追加のコミット)すると起動者がその人になり、
      # 通常の PR と同じく push まで走る。
      #
      # github.actor は再実行しても最初の起動者のままで、権限も最初の起動者のものが使われる
      # ため、人が再実行しても判定とシークレットの有無は食い違わない。
      # notify-slack の if にも同じ条件を書いている。片方だけ変えないこと。
      PUSH_IMAGE: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Container Image
        run: |
          DOCKER_BUILDKIT=1 \
          docker build . \
            --cache-from vsrecorder/core-apiserver:develop \
            --tag vsrecorder/core-apiserver:develop
      - name: Push Container Image
        if: env.PUSH_IMAGE == 'true'
        run: |
          docker push vsrecorder/core-apiserver:develop

  notify-slack:
    # Dependabot の実行と fork からの PR には SLACK_WEBHOOK_URL も渡されないので通知しない
    # (送れずにジョブが落ちるだけになる)。結果は PR のチェックで確認する。
    # 条件は build-and-push-container-image の PUSH_IMAGE と揃えること。
    if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - build-and-push-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slack Notification
        run: |
          SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
          SUCCESS="${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" \
          WORKFLOW="${{ github.workflow }}" \
          SERVER_URL="${{ github.server_url }}" \
          REPOSITORY="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          SHA="${{ github.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          ACTOR="${{ github.actor }}" \
          /bin/bash ./.github/scripts/notify_slack.sh
