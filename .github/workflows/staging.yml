name: For Staging

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"

# GITHUB_TOKEN の権限は、リポジトリの取得(checkout)に要る読み取りだけにする。
# リポジトリの設定(Settings → Actions → Workflow permissions)が書き込み可に変わっても、
# ここで絞った権限が優先される。このワークフローは GitHub への書き込み(コメント・リリース・
# タグなど)をしないので、書き込みが要るステップを足すときは、そのジョブにだけ permissions を書き足すこと。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go 1.27.4
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      # gofmt で整形されていないファイルがあれば落とす(make lint-fmt と同じ検査)。
      # テストより先に置き、整形漏れだけのときに長いテストを待たずに気付けるようにする。
      - name: Check gofmt
        run: make lint-fmt
      # infrastructure の書き込みが dbFromContext を経由しているかを検査する(make lint-tx)。
      # i.db を直接使うと、usecase 側のトランザクションに参加せず片方だけコミットされる。
      - name: Check transaction usage
        run: make lint-tx
      # CIのrunnerはUTC、開発機と本番はJSTのため両方で回す。片方だけだと、
      # time.Local に依存したテストが一方の環境でだけ通ってすり抜ける。
      # -count=1 はキャッシュ無効化。TZ はテストキャッシュのキーに入らないため、
      # 付けないと2回目が素通りして片方のタイムゾーンしか検証されない。
      - name: Run Test (UTC)
        run: TZ=UTC go test -count=1 -v -cover -race ./...
      - name: Run Test (Asia/Tokyo)
        run: TZ=Asia/Tokyo go test -count=1 -v -cover -race ./...

  build-and-push-container-image:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Container Image
        run: |
          DOCKER_BUILDKIT=1 \
          docker build . \
            --cache-from vsrecorder/core-apiserver:latest \
            --tag vsrecorder/core-apiserver:latest
      - name: Push Container Image
        run: |
          docker push vsrecorder/core-apiserver:latest

  notify-slack:
    if: ${{ always() }}
    needs:
      - build-and-push-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slack Notification
        run: |
          SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
          SUCCESS="${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" \
          WORKFLOW="${{ github.workflow }}" \
          SERVER_URL="${{ github.server_url }}" \
          REPOSITORY="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          SHA="${{ github.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          ACTOR="${{ github.actor }}" \
          /bin/bash ./.github/scripts/notify_slack.sh
